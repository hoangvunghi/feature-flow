[project]
name = "feature-flow"
version = "0.1.0"
description = "Vẽ + visualize luồng ship/debug một tính năng (light paper, step-by-step)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feature_flow"]
