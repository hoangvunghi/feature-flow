[project]
name = "feature-flow"
version = "0.2.0"
description = "Thư viện vẽ + visualize luồng ship/debug một tính năng: API Python + web xem/sửa nhúng được vào app khác"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
]

[project.optional-dependencies]
# chạy riêng bằng uvicorn (app nhúng thường đã có server ASGI của mình)
server = ["uvicorn[standard]>=0.29"]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# gói kèm static/ (UI + JS vendor) và guides/ (tài liệu hướng dẫn) vì nằm trong thư mục package
packages = ["feature_flow"]

[tool.hatch.build.targets.sdist]
include = ["feature_flow", "README.md", "tests"]
